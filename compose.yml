services:
  database:
    build: ./database          # <-- was: image: mysql:8.4
    container_name: app_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: mydb
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build: ./backend
    container_name: app_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: mydb
      DB_USER: app_user
      DB_PASSWORD: app_password
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build: ./frontend
    container_name: app_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
